<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storyboard Quest · Régie</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : deux faces d'un même studio. Écran élèves = une salle de projection sobre (scène à gauche, feuille de classement à droite, plein cadre pour les flashs). Producteur = une télécommande au pouce, onglets en bas. */
:root{
  --bg:#0D0F13; --s1:#14171D; --s2:#1B1F26; --s3:#232831; --hair:#272C35;
  --text:#ECE7DD; --soft:#C6C0B4; --muted:#8A919C;
  --accent:#EBA53D; --accent-ink:#1E1406; --good:#8FBF8A; --bad:#E0684F;
  --paper:#F4F0E7; --pen:#1B1D22;
  --c-coup:#7FB7C9; --c-doublure:#8FBF8A; --c-director:#E3876B; --c-associe:#C2A7E3; --c-joker:#EBA53D;
  --display:"Big Shoulders Display", "Arial Narrow", sans-serif;
  --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--text);height:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;color:#14110B;border:0}
.chip.joker{background:var(--c-joker)}.chip.coup{background:var(--c-coup)}.chip.doublure{background:var(--c-doublure)}.chip.director{background:var(--c-director)}.chip.associe{background:var(--c-associe)}

/* ---------- Affiche (chargement, hors-ligne) ---------- */
.poster{min-height:100%;display:grid;place-items:center;text-align:center;padding:32px max(16px,env(safe-area-inset-left,0px))}
.poster h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,8vw,96px);line-height:1.1;margin:14px 0 10px}
.poster p{color:var(--soft);max-width:44ch;margin:0 auto 18px}
.slate{display:inline-block;width:34px;height:24px;border-radius:3px;border:2px solid var(--text);background:repeating-linear-gradient(135deg,var(--text) 0 5px,transparent 5px 10px)}

/* ---------- ÉCRAN ÉLÈVES ---------- */
.proj{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.4vw;padding:1.6vw max(2.2vw,env(safe-area-inset-right,0px)) 1.8vw max(2.2vw,env(safe-area-inset-left,0px));overflow:hidden}
.p-top{display:flex;align-items:center;gap:1.4vw;font-family:var(--sans);font-size:max(12px,.85vw);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-brand{display:flex;align-items:center;gap:.8vw;color:var(--text);font-family:var(--display);font-weight:600;font-size:max(18px,1.7vw);letter-spacing:0;text-transform:none}
.p-brand .slate{width:max(22px,1.8vw);height:max(16px,1.3vw)}
.p-top .sp{flex:1}
.p-top b{color:var(--accent);font-weight:600}
.p-main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:1.8vw;min-height:0}
.p-main.full{grid-template-columns:minmax(0,1fr)}
.stage{position:relative;background:var(--s1);border-radius:10px;padding:2.4vw 2.6vw;display:flex;flex-direction:column;gap:1.2vw;min-height:0;overflow:hidden}
.stage::before,.stage::after{content:"";position:absolute;width:1.6vw;height:1.6vw;border:2px solid var(--accent);opacity:.9}
.stage::before{top:1vw;left:1vw;border-right:0;border-bottom:0}
.stage::after{bottom:1vw;right:1vw;border-left:0;border-top:0}
.seq-eyebrow{font-family:var(--sans);font-size:max(12px,.9vw);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seq-eyebrow b{color:var(--accent)}
.seq-title{font-family:var(--display);font-weight:600;font-size:clamp(40px,5.4vw,124px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.seq-title.rendu{color:var(--accent)}
.seq-desc{font-size:clamp(16px,1.55vw,32px);color:var(--soft);max-width:46ch;margin:0;line-height:1.35}
.seq-xp{align-self:flex-start;font-family:var(--sans);font-size:max(12px,1vw);font-weight:600;border:1px solid var(--accent);color:var(--accent);padding:.35vw .9vw;border-radius:999px}
.seq-fill{flex:1;min-height:0}
.draws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1vw}
.draws.one{grid-template-columns:minmax(0,1fr)}
.dcard{background:var(--paper);color:var(--pen);border-radius:8px;padding:1vw 1.2vw 1.2vw;display:flex;flex-direction:column;gap:.4vw}
.dcard span{font-family:var(--sans);font-size:max(12px,.7vw);letter-spacing:.08em;text-transform:uppercase;color:#6E685C}
.dcard strong{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.4vw,56px);line-height:1.1}
.flip .dcard{animation:flip .7s cubic-bezier(.2,.8,.2,1) both}
.flip .dcard:nth-child(2){animation-delay:.35s}.flip .dcard:nth-child(3){animation-delay:.7s}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.pairs{display:flex;flex-wrap:wrap;gap:.6vw}
.pair{font-size:max(13px,1.05vw);padding:.4vw 1vw;border-radius:999px;background:var(--s3);color:var(--soft)}
.pair i{font-style:normal;color:var(--accent);margin:0 .4vw}
.pair.guest{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.tc{display:flex;align-items:flex-end;justify-content:space-between;gap:1vw;border-top:1px solid var(--hair);padding-top:1vw}
.tc-num{font-family:var(--mono);font-weight:600;font-size:clamp(48px,7.4vw,170px);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:0}
.tc-num.idle{color:var(--muted)}.tc-num.low{color:var(--accent)}.tc-num.done{color:var(--bad)}
.tc-lab{text-align:right;font-family:var(--sans);font-size:max(12px,.85vw);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tc-lab b{display:block;font-family:var(--display);font-weight:600;text-transform:none;letter-spacing:0;font-size:clamp(28px,3vw,64px);color:var(--bad);line-height:1.1}
.tc-bar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.tc-bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}

.rank-col{display:flex;flex-direction:column;gap:1vw;min-height:0}
.rank-head{display:flex;justify-content:space-between;align-items:baseline}
.rank-head h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,2.3vw,52px);margin:0;line-height:1.1}
.closed{font-family:var(--sans);font-size:max(12px,.7vw);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:.2vw .6vw;border-radius:3px}
.board{display:flex;flex-direction:column;gap:.5vw;position:relative;min-height:0}
.row{display:grid;grid-template-columns:2.6vw minmax(0,1fr) auto;align-items:center;gap:1vw;padding:.75vw 1vw;border-radius:8px;background:var(--s1);position:relative;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.row.lead{background:linear-gradient(90deg,rgba(235,165,61,.16),rgba(235,165,61,.03));box-shadow:inset 0 0 0 1px rgba(235,165,61,.55)}
.rk{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.2vw,50px);line-height:1.1;color:var(--muted);text-align:center}
.row.lead .rk{color:var(--accent)}
.who{min-width:0;display:flex;flex-direction:column;gap:.4vw}
.nm{font-weight:600;font-size:clamp(15px,1.35vw,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:.6vw;align-items:center}
.bar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--soft);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row.lead .bar i{background:var(--accent)}
.pts{font-family:var(--sans);font-weight:600;font-size:clamp(16px,1.6vw,36px);font-variant-numeric:tabular-nums;text-align:right}
.pts small{font-size:.5em;color:var(--muted);margin-left:.2em}
.delta{position:absolute;right:1vw;top:-.6vw;background:var(--accent);color:var(--accent-ink);font-family:var(--sans);font-weight:600;font-size:max(12px,.95vw);padding:.15vw .6vw;border-radius:999px;animation:pop 2.8s ease-out both}
.delta.neg{background:var(--bad);color:#160806}
@keyframes pop{0%{transform:translateY(8px) scale(.6);opacity:0}12%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.full-area{display:grid;place-items:center;min-height:0;min-width:0}
.slide{container-type:inline-size;width:min(100%,calc((100vh - 7vw) * 16 / 9));aspect-ratio:16/9;background:var(--s1);border-radius:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:4.6cqw 5.4cqw;gap:2.4cqw}
.slide.accent{background:var(--accent);color:var(--accent-ink);justify-content:center}
.s-eye{font-family:var(--sans);font-size:1.15cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.slide.accent .s-eye{color:var(--accent-ink)}
.s-h{font-family:var(--display);font-weight:600;font-size:4.6cqw;line-height:1.1;margin:0;letter-spacing:-.01em}
.s-big{font-family:var(--display);font-weight:600;font-size:9cqw;line-height:1.1;margin:0}
.s-lead{font-size:2cqw;color:var(--soft);margin:0;max-width:60ch}
.slide.accent .s-lead{color:var(--accent-ink);font-weight:600}
.s-grid{display:grid;gap:1.6cqw;flex:1;min-height:0;align-content:start}
.s-card{background:var(--s2);border-radius:.8cqw;padding:2cqw;display:flex;flex-direction:column;gap:.8cqw}
.s-card h3{margin:0;font-family:var(--display);font-weight:600;font-size:2.6cqw;line-height:1.05;color:var(--text)}
.s-card .k{font-family:var(--sans);font-size:1cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.s-card p{margin:0;font-size:1.45cqw;color:var(--soft);line-height:1.35}
.s-fig{display:flex;flex-direction:column;gap:.7cqw;min-width:0}
.s-fig svg{width:100%;height:auto;display:block;border-radius:.4cqw}
.s-fig b{font-size:1.5cqw;font-weight:600}
.s-fig span{font-size:1.2cqw;color:var(--muted)}
.s-fig.ok b{color:var(--good)}.s-fig.ko b{color:var(--bad)}
.s-bars{display:flex;flex-direction:column;gap:1cqw}
.s-bars .lbl{font-family:var(--sans);font-size:1.05cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.s-strip{display:flex;gap:.5cqw;height:3.6cqw}
.s-strip i{display:block;border-radius:.4cqw;background:var(--paper)}
.s-strip.fast i{background:var(--accent)}
.s-time{display:flex;gap:.8cqw}
.s-time > div{background:var(--paper);color:var(--pen);border-radius:.8cqw;padding:1.8cqw;display:flex;flex-direction:column;gap:.6cqw}
.s-time > div.hot{background:var(--accent)}
.s-time .k{font-family:var(--sans);font-size:1.05cqw;color:#6E685C}
.s-time h3{margin:0;font-family:var(--display);font-weight:600;font-size:2.7cqw;line-height:1.1}
.s-time p{margin:0;font-size:1.4cqw;color:#3A372F}
.s-log{background:var(--accent);color:var(--accent-ink);border-radius:.8cqw;padding:2cqw}
.s-log .k{font-family:var(--sans);font-size:1cqw;letter-spacing:.08em;text-transform:uppercase}
.s-log p{margin:.6cqw 0 0;font-family:var(--display);font-weight:600;font-size:2.7cqw;line-height:1.1}
.s-ph{flex:1;border:2px dashed var(--hair);border-radius:.8cqw;display:grid;place-items:center;color:var(--muted);font-size:1.6cqw;text-align:center;padding:2cqw}
.s-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw;flex:1;min-height:0}
.s-pair figure{margin:0;display:flex;flex-direction:column;gap:.8cqw;min-height:0}
.s-pair img{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;border-radius:.6cqw}
.s-pair figcaption{font-family:var(--sans);font-size:1.05cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slide-count{position:absolute;right:2.4cqw;bottom:1.8cqw;font-family:var(--sans);font-size:1cqw;color:var(--muted)}

/* raccords piégés */
.trap{width:100%;height:100%;display:flex;flex-direction:column;gap:1.2vw;min-height:0}
.trap-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw}
.trap-head h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,4vw,96px);line-height:1.1;margin:.3vw 0}
.trap-head p{margin:0;color:var(--soft);font-size:max(14px,1.3vw)}
.trap-count{font-family:var(--sans);font-weight:600;font-size:max(12px,1vw);background:var(--accent);color:var(--accent-ink);padding:.4vw 1vw;border-radius:999px;white-space:nowrap}
.trap-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1vw;background:var(--paper);border-radius:10px;padding:1.2vw}
.trap-strip figure{margin:0;display:flex;flex-direction:column;gap:.5vw}
.trap-strip svg{width:100%;height:auto;display:block;background:#fff;border:2px solid var(--pen);border-radius:2px}
.trap-strip figcaption{font-size:max(12px,.9vw);color:var(--pen)}
.trap-strip figcaption b{display:block;font-family:var(--sans);font-size:max(12px,.7vw);color:#6B655A;letter-spacing:.08em}
.mark{display:none}.revealed .mark{display:inline}
.mark circle{fill:none;stroke:#E0503A;stroke-width:2.4}.mark rect{fill:#E0503A}.mark text{fill:#fff;font:600 8px var(--sans)}
.trap-ans{background:var(--s1);border-radius:10px;padding:1vw 1.4vw}
.trap-ans ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:.5vw;font-size:max(13px,1.15vw)}
.trap-ans b{color:var(--accent)}

/* plein cadre : média, contrat, films, palmarès */
.media{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:1vw;min-height:0}
.media img{flex:1;min-height:0;max-width:100%;object-fit:contain;border-radius:8px;background:#000}
.media .q{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.8vw,64px);margin:0}
.media .ans{font-family:var(--display);font-weight:600;font-size:clamp(30px,3.4vw,80px);color:var(--accent);margin:0}
.contract{width:min(100%,1100px);background:var(--paper);color:var(--pen);border-radius:10px;padding:3vw 3.6vw;display:flex;flex-direction:column;gap:1vw;max-height:100%;overflow:hidden}
.contract h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,3vw,64px);margin:0;line-height:1.1}
.contract p{margin:0;font-size:clamp(14px,1.25vw,26px);line-height:1.4}
.contract .sig{display:flex;justify-content:space-between;gap:2vw;font-family:var(--sans);font-size:max(12px,.9vw);color:#6E685C;margin-top:1vw}
.films,.prizes-big,.rank-big{width:min(100%,1500px);display:flex;flex-direction:column;gap:1vw}
.films h1,.prizes-big h1,.rank-big h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,4vw,96px);margin:0 0 .4vw;line-height:1.1}
.film-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,1.3fr));gap:1vw;align-items:center;background:var(--s1);border-radius:8px;padding:.9vw 1.2vw;font-size:clamp(14px,1.3vw,30px)}
.film-row b{font-weight:600}
.film-row span{color:var(--soft)}
.prize-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2vw}
.prize{background:var(--s1);border-radius:10px;padding:1.8vw 2vw;display:flex;flex-direction:column;gap:.6vw}
.prize span{font-family:var(--sans);font-size:max(12px,.9vw);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prize strong{font-family:var(--display);font-weight:600;font-size:clamp(30px,3.6vw,84px);line-height:1.1}
.prize.won{box-shadow:inset 0 0 0 1px var(--accent)}
.prize.won strong{color:var(--accent)}
.prize.wait strong{color:var(--s3)}
.prize em{font-family:var(--display);font-weight:600;color:var(--soft);font-size:clamp(14px,1.2vw,26px)}

.overlay{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;background:rgba(13,15,19,.55);animation:ov 2.9s ease both;padding:16px}
.overlay div{text-align:center}
.overlay small{display:block;font-family:var(--sans);font-size:clamp(13px,1.3vw,28px);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:1vw}
.overlay strong{font-family:var(--display);font-weight:600;font-size:clamp(56px,10vw,240px);line-height:1.1;color:var(--text)}
.overlay .clap{display:block;width:clamp(80px,9vw,200px);height:clamp(18px,2vw,44px);margin:0 auto 2vw;background:repeating-linear-gradient(135deg,var(--text) 0 14px,var(--bg) 14px 28px);border:3px solid var(--text);border-radius:4px;animation:clap .5s ease both}
@keyframes clap{from{transform:rotate(-14deg);transform-origin:left bottom}to{transform:none}}
@keyframes ov{0%{opacity:0}10%{opacity:1}78%{opacity:1}100%{opacity:0}}
.quit{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;font-family:var(--sans);font-size:max(12px,.8vw);letter-spacing:0;text-transform:none;color:var(--soft);opacity:.55;transition:opacity .2s}
.quit:hover,.quit:focus-visible{opacity:1}

@media (max-width:820px){
  .proj{height:auto;min-height:100%;overflow:visible;padding:16px}
  .p-main{grid-template-columns:1fr}
  .stage{padding:22px}
  .row{grid-template-columns:32px minmax(0,1fr) auto;padding:10px 12px}
  .draws{grid-template-columns:1fr}
  .trap-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .film-row{grid-template-columns:1fr}
  .prize-grid{grid-template-columns:1fr}
}

/* ---------- PRODUCTEUR ---------- */
.prod{max-width:760px;margin:0 auto;min-height:100%;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--hair);margin-bottom:16px}
.ph .p-brand{font-size:21px;gap:9px}
.ph .p-brand .slate{width:24px;height:17px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.sync.busy{background:var(--accent)}.sync.err{background:var(--bad)}
.ph .sp{flex:1}
.cast{display:flex;align-items:center;gap:8px;background:var(--text);color:var(--bg);border:0;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.cast svg{width:16px;height:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s1);border-top:1px solid var(--hair);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:760px}
.tab{background:none;border:0;padding:8px 4px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{color:var(--text);background:var(--s2)}

  I("note",25,"Rendu 1 : l'histoire en 6 cases","Racontez cette histoire en 6 cases dessinées, sans texte. En Italie, un train de voyageurs s'engage sur un immense pont au-dessus d'un ravin. Un rail cède : le train déraille et la locomotive bascule dans le vide. À Paris, Alex, un jeune super-héros, entend le fracas au loin. Il traverse l'Europe en hypervitesse. Il rattrape la locomotive au-dessus du vide et la retient à bout de bras. Dans sa cabine, le conducteur n'en revient pas.","Rendu noté",{
   p:"La planche vierge 6 cases imprimée (PDF), une par élève et quelques-unes en plus. Un devoir Classroom « Rendu 1 ».",
   s:["L'histoire s'affiche à l'écran, la même pour toute la classe. Il n'y a rien à inventer : tout le travail porte sur le choix des 6 moments et des 6 cadres.","Chacun dessine seul, à la main, sur la planche 6 cases. Aucun texte dans les cases.","Lance le chrono : 20 minutes de dessin, 5 minutes pour photographier la planche à plat et la déposer dans Classroom.","Note les étoiles ci-dessous, en direct ou ce soir. La brique attendue : quelqu'un qui ne connaît pas l'histoire la comprend en regardant les 6 cases."],r:0}),
  I("info",0,"Débrief du matin","Retours, classement et bonus de production.","Bonus",{
   s:["Affiche le classement (bouton ci-dessous).","Montre deux ou trois planches du rendu 1. Demande à la salle ce qu'elle comprend, puis rappelle la règle d'or.","Donne un bonus de production au meilleur du matin (onglet Élèves, menu « Bonus »). Une demi-journée sur deux, donne-le plutôt à celui qui a le plus progressé."],t:["rank"]})],
 "1-aprem":[
  I("info",0,"Flash 2 : le cadre","Les 8 valeurs de plan, la plongée et la contre-plongée.","",{
   s:["Fais défiler les diapos ci-dessous.","Fais répéter les abréviations à voix haute : PGE, PE, PM, PA, PR, GP, TGP. Le Pictionary qui suit les utilise."],t:["slides"],a:{mode:"flash",k:1}}),
  I("defi",15,"Pictionary des plans","Un élève dessine au tableau une valeur de plan et un sujet. Les autres trouvent les deux. Le premier qui trouve marque.","5 XP par bonne réponse",{
   p:"Le grand écran tactile (avec une appli de dessin) ou un tableau et un feutre.",
   s:["Tire une carte secrète avec le bouton ci-dessous : une valeur de plan et un sujet (par exemple « Gros plan · un lion »). Elle n'apparaît que chez toi. Montre-la discrètement au dessinateur.","Il dessine en 45 secondes.","Le premier qui trouve la valeur ET le sujet gagne 5 XP et dessine à son tour. Exige le terme exact : « gros plan », pas « de près »."],t:["secret","xp"]}),
  I("defi",35,"Chasse au cadre","En binôme : photographiez les 8 valeurs de plan dans l'école, en vous mettant en scène l'un l'autre. Une photo par valeur, dans l'ordre.","5 XP par valeur juste",{
   p:"Les téléphones. Cour et fenêtres autorisées pour le plan de grand ensemble. Un devoir Classroom « Chasse au cadre ».",
   s:["Tire les binômes ci-dessous. Garde-les : les mêmes servent à la projection qui suit.","Les 8 valeurs restent affichées à l'écran pendant tout le défi.","Lance le chrono : 30 minutes, puis dépôt dans Classroom."],t:["pairs"],v:1}),
  I("info",0,"Projection de la chasse","On regarde vos 8 plans. La salle annonce chaque valeur.","5 XP par valeur juste",{
   s:["Mêmes binômes que pour la chasse : ils restent affichés ci-dessous.","Ouvre chaque série depuis Classroom sur le grand écran.","Pour chaque photo, la salle annonce la valeur. Si le binôme l'a bien cadrée : +5 XP au binôme (boutons ci-dessous)."],t:["pairs-keep","xp"],k:1,v:1}),
  PAUSE(),
  I("defi",25,"Quiz : quel plan ?","Une image, une question : quelle valeur de plan ? Le plus rapide gagne.","5 XP par bonne réponse",{

   s:["Image suivante et réponse avec les boutons ci-dessous.","Le premier qui donne la bonne valeur gagne 5 XP."],t:["quiz","xp"],a:{mode:"quiz"}}),
  I("note",50,"Rendu 2 : les 3 émotions","La même scène, trois fois, en 3 cases : 1. Seul chez lui le soir, quelqu'un entend frapper. 2. Il s'approche de la porte. 3. Il ouvre. PEUR : il n'y a personne, juste le couloir sombre. DRÔLE : c'est un voisin en pyjama qui lui rapporte son chat. ÉMOUVANT : c'est son meilleur ami, parti depuis des années, une valise à la main. Sous chaque case : la valeur (PM, GP…), et l'angle s'il n'est pas normal.","Rendu noté",{
   p:"Trois planches vierges 3 cases par élève. Un devoir Classroom « Rendu 2 ».",
   s:["La scène s'affiche à l'écran, la même pour toute la classe. Les trois révélations sont imposées : il n'y a rien à inventer.","Le message : l'action ne change pas, seuls le cadre et l'angle créent la peur, le rire ou l'émotion.","Lance le chrono : 45 minutes de dessin, 5 minutes pour la photo et le dépôt.","Note les étoiles ci-dessous. La brique attendue : la valeur et l'angle servent l'émotion."],r:1}),
  I("info",0,"Débrief de la journée","Retours, classement, bonus et avant-goût de mardi.","Bonus",{

  I("defi",25,"Atelier 180°","Deux comédiens, un dialogue, vos caméras. Pourquoi ça casse ? À vous de trouver.","15 XP à chacun si la classe trouve la règle",{

  I("defi",25,"Chacun sa version du 180°","Une action tirée au sort : dessinez la scène vue de dessus, la ligne et vos caméras.","15 XP si c'est juste",{

  I("note",30,"Rendu 3 : le rendez-vous","Deux personnages se retrouvent, s'assoient, se parlent. 6 cases numérotées 1.1 à 1.6, sans franchir la ligne.","Rendu noté",{

 "2-aprem":[

   p:"La planche vierge 12 cases, une par élève.",
   s:["Chacun dessine la case 1 d'une histoire sur sa planche, puis passe la feuille à droite.","Le suivant dessine la case suivante, qui doit raccorder avec la précédente (mouvement, regard, objet ou son). Il écrit sous la case le type de raccord choisi.","3 minutes par case (chrono), jusqu'à ce que chaque feuille revienne à son auteur.","Chacun montre la chaîne de sa feuille : on vérifie que chaque raccord fonctionne. « +15 à tous »."],t:["xp"]}),

  I("note",65,"Rendu 4 : la course-poursuite","12 cases numérotées 1.1 à 1.12. Sous chaque case : valeur et mouvement. Tout le monde court dans le même sens, et on coupe pendant le geste.","Rendu noté",{

  I("info",0,"Brief du mercredi","Mercredi, vous travaillez seuls. Le matin : le découpage technique d'une histoire imposée. L'après-midi : le storyboard du découpage d'un camarade. C'est le rendu 7, présenté jeudi matin.","Rendu noté",{
   p:"Avant mardi soir : crée dans Classroom les devoirs « Mercredi · Découpage » et « Mercredi · Storyboard ». Joins-y le texte des missions, les 8 histoires, le modèle de découpage et le découpage de secours (onglet Kit, section Mercredi). Chaque élève emporte une planche vierge 12 cases.",
   s:["Clique « Tirer les histoires et les échanges » ci-dessous : chaque élève reçoit une histoire différente et le nom du camarade à qui il enverra son découpage.","Affiche les missions, puis les attributions (boutons ci-dessous). Laisse-leur le temps de noter leur histoire et leur camarade.","Montre le découpage modèle (Le ticket de loterie, onglet Kit) : c'est exactement ce qu'on attend le matin.","Matin : chacun écrit le découpage de son histoire, 10 à 12 plans pour 45 secondes, dans le tableau modèle. Envoi au camarade par e-mail ou messagerie, et dépôt dans Classroom, dès qu'il est terminé.","Après-midi : chacun dessine le storyboard du découpage reçu, sans rien changer. Quand une indication manque ou est floue, il dessine son meilleur choix et met un « ? » sous la case. Dépôt dans Classroom une fois la planche finie.","Règle de secours : si on n'a toujours rien reçu au moment de commencer le storyboard, on dessine le découpage de secours (Le ticket de loterie) et on le signale dans Classroom.","Rappelle que c'est noté (rendu 7) et présenté jeudi matin. Devoir en plus : installer Storyboarder, sans l'utiliser."],t:["mercredi"],a:{mode:"mercredi"}})],
 "3-matin":[

  I("note",35,"Rendu 7 : les travaux du mercredi","Pour chaque élève : son découpage, puis le storyboard qu'un camarade en a tiré. Est-ce le film qu'il avait en tête ?","Rendu noté",{

  I("info",0,"Flash 6 : rythme et son","La durée d'une case est un choix.","",{s:["Fais défiler les diapos ci-dessous.","Exemple à faire vivre : passe la même planche avec deux musiques différentes. Le son change le sens de l'image."],t:["slides"],a:{mode:"flash",k:5}}),
  I("info",0,"Démo Storyboarder","Prise en main guidée : dessiner une case, régler sa durée, ajouter un son, exporter.","",{

var MER=[
 ["Le dernier métro","Une jeune femme court dans un couloir de métro désert. Elle entend la rame arriver et dévale l'escalier. Les portes se ferment juste devant elle. Elle frappe la vitre, le métro part sans elle. Sur le quai, un vieil homme assis sur un banc lui tend la moitié de son sandwich. Elle s'assoit à côté de lui."],
 ["Le cambrioleur et le chien","La nuit, un cambrioleur entre par la fenêtre d'une maison endormie. Il avance à pas de loup, lampe torche à la main. Un énorme chien se dresse devant lui en grognant. Le cambrioleur sort un biscuit de sa poche et le lui tend. Dernière image : le cambrioleur repart par la fenêtre, et le chien le suit en remuant la queue."],
 ["L'entretien d'embauche","Un candidat attend dans un couloir, très stressé. On l'appelle. Il entre, trébuche sur le tapis et renverse le café du recruteur sur son bureau. Silence. Le recruteur le regarde, éclate de rire et lui tend la main : c'est son ancien camarade de classe."],
 ["Le penalty","Dernière minute d'un match de football. Un joueur pose le ballon au point de penalty. Le gardien le fixe. Le joueur prend son élan et frappe. Le ballon touche la barre transversale… et rentre. Le joueur tombe à genoux, ses coéquipiers lui sautent dessus."],
 ["Le gâteau d'anniversaire","Un enfant porte un gros gâteau aux bougies allumées dans un couloir sombre. Derrière une porte, sa famille chante. Il pousse la porte avec le coude, se prend les pieds dans le seuil, et le gâteau s'envole. Le gâteau retombe, intact, dans les mains de son père."],
 ["L'ascenseur en panne","Un homme pressé entre dans un ascenseur où se trouve déjà une femme. L'ascenseur s'arrête net entre deux étages, la lumière clignote. L'homme panique et appuie sur tous les boutons. La femme sort calmement un jeu de cartes. Dernière image : les portes s'ouvrent, ils sont assis par terre en pleine partie, et ne veulent plus sortir."],
 ["Le cerf-volant","Sur une plage, une petite fille fait voler un cerf-volant. Une rafale lui arrache la ficelle des mains. Le cerf-volant s'envole au-dessus des dunes. Un garçon court, saute et attrape la ficelle au vol. Il revient et rend le cerf-volant à la petite fille, qui lui sourit."],
 ["Le duel","Deux cow-boys se font face dans la rue principale d'une ville de western. Les habitants ferment leurs volets. Les mains frôlent les étuis. Le premier dégaine… un harmonica et joue trois notes. Le second dégaine une guitare et lui répond. Les habitants sortent et applaudissent."]

 roman:{n:"Histoire du roman-photo",items:[
  "La dernière chaise. A et B repèrent en même temps la dernière chaise libre. Ils accélèrent, puis se mettent à courir. A arrive le premier et s'assoit, triomphant. Il se relève aussitôt en grimaçant : il était assis sur un chewing-gum. B éclate de rire.",
  "La porte qui résiste. A veut passer une porte. Il pousse : elle ne s'ouvre pas. Il pousse plus fort, avec l'épaule, puis à deux mains. B arrive derrière lui, attend, puis tire simplement la porte vers lui. A, gêné, lui fait signe de passer en premier.",
  "Le téléphone oublié. A pose son téléphone sur une table et s'en va. B le remarque, le prend et court derrière A pour le lui rendre. A se retourne, croit qu'on le poursuit et s'enfuit. B finit par le rattraper et lui tend le téléphone. A le reprend, honteux, et le remercie.",
  "Le gobelet. A marche lentement avec un gobelet d'eau rempli à ras bord, sans le quitter des yeux. B surgit d'un angle et l'évite de justesse. A souffle, soulagé, et sourit. Il fait un pas de plus, trébuche et renverse toute l'eau sur ses chaussures.",
  "Les clés. A arrive devant une porte fermée et cherche ses clés : poches, veste, sac. Paniqué, il vide son sac par terre. B arrive, le regarde faire, puis lui montre la porte : les clés sont déjà dans la serrure. A ramasse ses affaires, vexé.",
  "Le selfie raté. A pose son téléphone et lance le retardateur pour une photo avec B. Il court se placer à côté de B. Il glisse et tombe juste au moment du déclic. Dernière photo : l'écran du téléphone, avec B qui sourit et A étalé par terre.",
  "Le gâteau. A pose son paquet de gâteaux sur une table et se retourne pour fouiller dans son sac. B en prend un et le croque. A se retourne et compte ses gâteaux, soupçonneux. B, l'air innocent, montre la fenêtre. A regarde la fenêtre, puis remarque la miette sur le menton de B.",
  "La course. A et B se défient du regard et partent en courant vers un mur au bout du couloir ou du parking. B mène, A revient à sa hauteur. Juste avant l'arrivée, B s'arrête net : son lacet est défait et il tombe. A touche le mur le premier, puis revient aider B à se relever.",
  "Le mot plié. A écrit quelques mots sur un papier, le plie et le glisse dans le sac de B sans être vu. Plus tard, B trouve le papier, le déplie et sourit. On ne voit jamais ce qui est écrit. B cherche du regard qui l'a mis. Il croise le regard de A, qui détourne les yeux, gêné."]},

var PEN="#1B1D22",SOFT="#9A9387",COL={red:"#D2452F",blue:"#2F6BD2",green:"#2E9B57",white:"#FFFFFF",yellow:"#E8B422"};

/* --- Primitives de dessin (viewBox 160 x 90) --- */
function ln(x1,y1,x2,y2,w,c){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||PEN)+'" stroke-width="'+(w||1.6)+'" stroke-linecap="round"/>'}

function floor(y){return ln(0,y,160,y,1,SOFT)}

/* Tête avec regard : le nez et l'œil indiquent la direction (dir = 1 droite, -1 gauche) */
function head(x,y,r,dir,o){

  s+=circ(x,y,r,"#fff",PEN,r>12?2.2:1.6);

function overlay(small,big,clap){var o=document.createElement("div");o.className="overlay";o.innerHTML='<div>'+(clap?'<span class="clap"></span>':'')+(small?'<small>'+esc(small)+'</small>':'')+'<strong>'+esc(big)+'</strong></div>';document.body.appendChild(o);setTimeout(function(){o.remove()},3000)}
function animateProj(prev){
  var reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  if(!prev||reduce)return;
  var px={},porder=prev.students.slice().sort(function(a,b){return b.xp-a.xp||a.name.localeCompare(b.name)}).map(function(s){return s.id});
  prev.students.forEach(function(s){px[s.id]=s.xp});
  var board=document.getElementById("board");
  if(board){
    var rows=[].slice.call(board.children),hgt=rows[0]?rows[0].getBoundingClientRect().height+8:0;
    rows.forEach(function(row,i){var id=row.getAttribute("data-id"),old=porder.indexOf(id);
      if(old>=0&&old!==i){row.style.transition="none";row.style.transform="translateY("+((old-i)*hgt)+"px)"}
      var d=(byId(id)||{}).xp-(px[id]==null?(byId(id)||{}).xp:px[id]);
      if(d){var b=document.createElement("span");b.className="delta"+(d<0?" neg":"");b.textContent=(d>0?"+":"")+d+" XP";row.appendChild(b);
        var pts=row.querySelector(".pts"),a=px[id],z=(byId(id)||{}).xp,t0=performance.now();
        (function step(t){var k=Math.min(1,(t-t0)/1100);pts.innerHTML=Math.round(a+(z-a)*(1-Math.pow(1-k,3)))+"<small>XP</small>";if(k<1)requestAnimationFrame(step)})(t0);}
    });
    board.offsetHeight;requestAnimationFrame(function(){rows.forEach(function(r){r.style.transition="";r.style.transform=""})});
  }
  PRIZES.forEach(function(p){var id=S.prizes[p[0]];if(id&&prev.prizes&&prev.prizes[p[0]]!==id){var w=byId(id);if(w)overlay(p[1],w.name)}});
  if(S.closed&&!prev.closed){var j=null;S.students.forEach(function(s){if((s.cards||[]).indexOf("joker")>=0)j=s});if(j)overlay("Joker pour",j.name)}
  if(S.challenge&&(!prev.challenge||prev.challenge.n!==S.challenge.n)&&S.mode==="seq")overlay("","Action !",true);
}

function grades(sid){
  var n=G.notes[sid]||{},r=n.r||[],f=n.f||[];
  var rn=r.filter(function(x){return x!=null}),fn=f.filter(function(x){return x!=null});
  var parc=rn.length?r.reduce(function(a,b){return a+(b||0)},0)/3.5:null;
  var prof=fn.length?f.reduce(function(a,b){return a+(b||0)},0)/2:null;
  var fs=G.fiches.filter(function(x){return x.to===sid&&x.from!==sid}),pe=null;
  if(fs.length){var t=0;for(var c=0;c<4;c++){var v=fs.map(function(x){return x.c&&x.c[c]}).filter(function(x){return x!=null});t+=v.length?v.reduce(function(a,b){return a+b},0)/v.length:0}pe=t/2}
  var fin=prof==null?null:(pe==null?prof:0.75*prof+0.25*pe);
  var cc=fs.filter(function(x){return x.cc}).length;
  var mx=0;S.students.forEach(function(x){if(x.xp>mx)mx=x.xp});var me=byId(sid),xpp=mx>0&&me?2*Math.max(0,me.xp)/mx:0;
  var p9=parc==null?null:parc*0.9,f9=fin==null?null:fin*0.9;
  return {parc:parc,prof:prof,pe:pe,fin:fin,p9:p9,f9:f9,xpp:xpp,note:(p9!=null&&f9!=null)?p9+f9+xpp:null,n:fs.length,cc:cc};
}

   case"rm-fiche":db.doc("fiches/"+b.getAttribute("data-fid")).delete().catch(function(){toast("Suppression impossible")});return;
   case"bk-now":backup("manuel-"+Date.now()).then(function(){toast("Sauvegarde faite")});return;
   case"bk-dl":var dump=JSON.stringify({at:new Date().toISOString(),state:S,notes:G.notes,fiches:G.fiches},null,1);downloads.save({filename:"sauvegarde-storyboard-quest-"+stamp()+".json",data:dump}).then(function(){toast("Copie téléchargée")},function(e){if(!e||e.code!=="declined")toast("Téléchargement impossible")});return;
   case"bk-restore":var bk=b.getAttribute("data-bk");if(!armed["bk-"+bk]){arm("bk-"+bk);return}delete armed["bk-"+bk];var B=G.bk[bk];if(!B||!B.state)return;backup("avant-restauration-"+Date.now());S=defaults(JSON.parse(JSON.stringify(B.state)));Object.keys(B.notes||{}).forEach(function(k){G.notes[k]=B.notes[k];saveNote(k)});commit();toast("Sauvegarde restaurée");return;
   case"csv":downloads.save({filename:"notes-storyboard-quest.csv",data:csv(";")}).then(function(){toast("Tableau téléchargé")},function(e){if(!e||e.code!=="declined")toast("Téléchargement impossible")});return;
   case"copy":var txt=csv("\t");if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast("Copié : colle dans Excel")},function(){toast("Copie impossible sur cet appareil")});return;
   default:return;
  }
  commit();
});
app.addEventListener("change",function(ev){
  var t=ev.target;if(!S)return;
  if(t.id==="r-day"||t.id==="r-slot"){if(t.id==="r-day")S.day=+t.value;else S.slot=t.value;lsSet("sq-open-list","1");commit();return}
  var pj=t.getAttribute("data-pj");if(pj&&S.projects[pj]){S.projects[pj][t.getAttribute("data-k")]=t.value;var pp=S.projects[pj];S.draw={title:"Mission de réalisateur",who:pj,items:[{l:"Genre",v:pp.genre},{l:"Lieu",v:pp.lieu},{l:"Objet",v:pp.objet}],k:String(Date.now())};commit();return}
  var pz=t.getAttribute("data-prize");if(pz!=null){if(t.value)S.prizes[pz]=t.value;else delete S.prizes[pz];S.mode="palmares";commit();return}
  var gv=t.getAttribute("data-give");if(gv&&t.value){var st=byId(gv);if(st){st.cards.push(t.value);toast(st.name+" gagne : "+CARDS[t.value].full)}commit();return}
  var qa=t.getAttribute("data-qa");if(qa!=null){S.media.quiz[+qa].a=t.value;commit();return}
  var up=t.getAttribute("data-up");if(up&&t.files&&t.files.length&&assets){
    var files=[].slice.call(t.files);toast("Envoi de "+files.length+" image"+(files.length>1?"s":"")+"…");
    files.reduce(function(p,f){return p.then(function(){return assets.upload(f).then(function(r){if(up==="quiz")S.media.quiz.push({id:r.id,a:""});else S.media.ex.push(r.id)})})},Promise.resolve()).then(function(){commit();toast("Images ajoutées")},function(e){commit();toast("Une image n'a pas pu être envoyée"+(e&&e.message?" : "+e.message:""))});
    return;
  }
});
document.addEventListener("toggle",function(e){var d=e.target;if(d&&d.classList&&d.classList.contains("nd")){var k=d.getAttribute("data-sid");if(d.open)openN[k]=1;else delete openN[k]}},true);
document.addEventListener("toggle",function(e){if(e.target&&e.target.id==="dl")lsSet("sq-open-list",e.target.open?"1":"0")},true);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&route()==="projection"&&isEditor){location.hash=""}});
window.addEventListener("hashchange",function(){render()});
function csv(sep){
  var head=["Élève"].concat(RENDUS,["Parcours /9"],CRITS,["Formateur /10","Camarades /10","Final /9","XP","XP /2","Note /20","Coups de cœur"]);
  var rows=[head];S.students.forEach(function(s){var n=G.notes[s.id]||{},g=grades(s.id),r=n.r||[],f=n.f||[];rows.push([s.name].concat([0,1,2,3,4,5,6].map(function(i){return r[i]==null?"":r[i]}),[fmt(g.p9)],[0,1,2,3].map(function(i){return f[i]==null?"":f[i]}),[fmt(g.prof),fmt(g.pe),fmt(g.f9),s.xp,fmt(g.xpp),fmt(g.note),g.cc]))});
  return rows.map(function(r){return r.map(function(c){c=String(c).replace(/—/g,"");return /[";\t\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(sep)}).join("\n");
}

/* =================== DÉMARRAGE =================== */
function poster(title,text,btn){app.innerHTML='<div class="poster"><div><span class="slate" aria-hidden="true"></span><h1>'+title+'</h1><p>'+text+'</p>'+(btn||'')+'</div></div>'}
var ROSTER=["Aaron","Chloé","Clarisse","Lucile","Raphael","Awen","Guillaume"];
app.addEventListener("click",function(e){var b=e.target.closest("[data-boot]");if(!b||!db)return;
  b.disabled=true;b.textContent="Création…";
  var init=defaults({v:3,students:ROSTER.map(function(n,i){return {id:"e"+(i+1),name:n,xp:0,cards:[]}}),challenge:null});
  db.doc("live/state").set(init).then(function(){if(!S){S=defaults(JSON.parse(JSON.stringify(init)));render()}},function(err){b.disabled=false;b.textContent="Créer le studio";poster("Storyboard Quest","La création du studio a échoué"+(err&&err.code?" ("+esc(err.code)+")":"")+". Recharge la page et réessaie.",'<button class="btn pri" type="button" data-boot="1">Réessayer</button>')});
});
function start(){
  if(!window.claude||!window.claude.use){poster("Storyboard Quest","Ouvre cette page dans Claude pour lancer le studio.");return}
  Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("assets"),window.claude.use("downloads")]).then(function(r){
    db=r[0];var user=r[1];assets=r[2];downloads=r[3];
    if(!db){poster("Storyboard Quest","L'écran du studio est projeté en classe. Connecte-toi à Claude pour le suivre ici.");return}
    var ed=user?user.canEdit():Promise.resolve(false);
    ed.then(function(ok){isEditor=!!ok;
      db.doc("live/state").onSnapshot(function(snap){
        if(!snap.exists){
          if(S)return;
          if(snap.metadata&&snap.metadata.fromCache){poster("Storyboard Quest","Ouverture du studio…");return}
          if(isEditor)poster("Storyboard Quest","Le studio n'est pas encore créé.",'<button class="btn pri" type="button" data-boot="1">Créer le studio</button>');else poster("Storyboard Quest","Le studio ouvre bientôt.");return}
        var data=JSON.parse(JSON.stringify(snap.data()));
        if(dirty&&S)return;
        if(S&&JSON.stringify(data)===JSON.stringify(S))return;
        var prev=S?JSON.parse(JSON.stringify(S)):null;S=defaults(data);
        var flip=prev&&S.draw&&(!prev.draw||prev.draw.k!==S.draw.k);
        if(view()==="prod"){var ae=document.activeElement,keep=ae&&ae.id&&(ae.tagName==="INPUT");if(!keep)render()}
        else{render(flip);animateProj(prev)}
      },function(e){poster("Storyboard Quest","Connexion au studio impossible"+(e&&e.code?" ("+esc(e.code)+")":"")+". Recharge la page.")});
      if(isEditor){
        db.collection("notes").onSnapshot(function(qs){var o={};qs.docs.forEach(function(d){o[d.id]=d.data()});Object.keys(notePend).forEach(function(k){if(o[k]&&sameNote(o[k],notePend[k].v)&&notePend[k].t&&Date.now()-notePend[k].t>3000)delete notePend[k];else o[k]=notePend[k].v});G.notes=o;if(tab==="notes"&&view()==="prod")render()},function(){});
        db.collection("backups").onSnapshot(function(qs){var o={};qs.docs.forEach(function(d){o[d.id]=d.data()});G.bk=o;if(tab==="eleves"&&view()==="prod")render()},function(){});
        db.collection("fiches").onSnapshot(function(qs){G.fiches=qs.docs.map(function(d){var x=d.data();x._id=d.id;return x}).sort(function(a,b){return (a.at||0)-(b.at||0)});if(tab==="notes"&&view()==="prod")render()},function(){});
      }
    });
  }).catch(function(){poster("Storyboard Quest","Connexion au studio impossible pour le moment. Recharge la page.")});
}
start();
})();
